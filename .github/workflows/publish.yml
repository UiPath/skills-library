name: Publish package

# Channels (see docs/release.md). Registry follows channel:
#   - push to `main`                       -> `dev`     : GitHub Packages, `<base>-dev.<run>`
#   - push to `release/v*`                 -> `preview` : npmjs, `<base>-preview.<run>`
#   - workflow_dispatch (channel: latest)  -> `latest`  : npmjs, the committed package.json version
#   - workflow_dispatch (channel: preview) -> `preview` : npmjs
#   - workflow_dispatch (channel: dev)     -> `dev`     : GitHub Packages, from main only
#
# Stamped versions are never committed. Stable is manual-only. npmjs publishes use
# OIDC trusted publishing with --provenance, so the repo holds no npm token.
# `npm install @uipath/skills-library` with no tag always resolves the last stable.

# The sprint cut finds the run it dispatched by its request_id.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Publish {0} from {1} {2}', github.event.inputs.channel, github.ref_name, github.event.inputs.request_id)
      || format('Publish from {0}', github.ref_name) }}

on:
  push:
    branches: [main, 'release/v*']
  workflow_dispatch:
    inputs:
      channel:
        description: "Publish channel"
        required: true
        default: preview
        type: choice
        options: [preview, dev, latest]
      request_id:
        description: "Set by the sprint cut to find its own run. Leave empty."
        required: false
        default: ""

# One publish per channel at a time, across branches, since the dist-tag is what
# they share; never cancel one in flight. `dev` is main-only and the sprint cut
# dispatches only preview, so a push to main never queues behind the cut's run.
concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel || (github.ref == 'refs/heads/main' && 'dev' || 'preview') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    # Not named like the PR check, so the required context on the merge commit stays unambiguous.
    name: Publish guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run version:check
      - run: npm run validate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      # Every channel, dev included; the npmjs job scans the packed tarball again.
      - run: npm run content:check

  publish-dev:
    name: Publish dev to GitHub Packages
    needs: [guard]
    # The repo guard stops forks from publishing on their own main. `dev` tracks main
    # only: a dev build from a release branch would move the tag back to an older line.
    if: >-
      github.repository == 'UiPath/skills-library'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'dev'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@uipath"

      - name: Stamp dev version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          npm version "${BASE}-dev.${RUN_NUMBER}" --no-git-tag-version --allow-same-version
          npm run version:sync
          echo "Publishing ${BASE}-dev.${RUN_NUMBER} to dist-tag dev"

      # GitHub Packages does not support --provenance.
      - name: Publish
        run: npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npmjs:
    name: Publish to npmjs (latest / preview)
    needs: [guard]
    # Stable ships only from a release line. The ref check fails fast; the real gate
    # is the environment, which a branch cannot remove by editing this file.
    if: >-
      github.repository == 'UiPath/skills-library'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v'))
          || (github.event_name == 'workflow_dispatch'
              && ((github.event.inputs.channel == 'latest' && startsWith(github.ref, 'refs/heads/release/v'))
                  || (github.event.inputs.channel == 'preview'
                      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/v'))))))
    runs-on: ubuntu-latest
    # Its deployment-branch policy (main, release/v*) is enforced by GitHub, and the
    # npmjs trusted publisher requires this environment, so an OIDC token minted
    # from any other branch, or from a copy of this file without it, is refused.
    environment: npm-publish
    permissions:
      contents: read
      # OIDC trusted publishing: the npmjs trusted publisher for @uipath/skills-library
      # must name this repo (UiPath/skills-library), this workflow (publish.yml) and
      # the npm-publish environment.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      # Node 22 ships npm 10; trusted publishing needs npm >= 11.5.1. Pinned to a major
      # so a new npm major is a deliberate edit, not a surprise on release day.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@12
          echo "npm $(npm --version) / node $(node --version)"

      # `latest` only moves forward: a stable publish of an older line (a hotfix on
      # release/v<M.N> after M.(N+1) went stable) is refused. Only the highest release
      # line owns the bare `preview` tag; a lower line publishes to `preview-v<M.N>`.
      # Fails closed: an unreachable registry stops the publish. Only a package npm
      # has never seen (E404) counts as "no tags yet".
      - name: Resolve dist-tag and stamp version
        id: dist
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if ! TAGS=$(npm view @uipath/skills-library dist-tags --json --registry=https://registry.npmjs.org/ 2>"$RUNNER_TEMP/npm-view.err"); then
            if grep -qE '^npm (error|ERR!) code E404$' "$RUNNER_TEMP/npm-view.err"; then
              TAGS='{}'
            else
              cat "$RUNNER_TEMP/npm-view.err"
              echo "::error::Could not read the current dist-tags from npmjs; refusing to guess."
              exit 1
            fi
          fi
          # npm 12 wraps `npm view --json` in an array; npm 11 printed the object.
          TAGS=$(echo "$TAGS" | jq -c 'if type == "array" then (.[0] // {}) else . end')
          BASE=$(node -p "require('./package.json').version")
          # Highest of two versions by M.N.P, ignoring any pre-release stamp.
          highest() { printf '%s\n%s\n' "${1%%-*}" "${2%%-*}" | sort -V | tail -1; }

          if [ "$CHANNEL" = "latest" ]; then
            CURRENT=$(echo "$TAGS" | jq -r '.latest // empty')
            if [ -n "$CURRENT" ] && { [ "$CURRENT" = "$BASE" ] || [ "$(highest "$CURRENT" "$BASE")" != "$BASE" ]; }; then
              echo "::error::latest is at $CURRENT; publishing $BASE would not move it forward."
              exit 1
            fi
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Publishing $BASE to dist-tag latest (latest is at ${CURRENT:-unset})"
            exit 0
          fi

          PREVIEW="${BASE}-preview.${RUN_NUMBER}"
          npm version "$PREVIEW" --no-git-tag-version --allow-same-version
          npm run version:sync
          TAG=preview
          CURRENT=$(echo "$TAGS" | jq -r '.preview // empty')
          if [ -n "$CURRENT" ] && [ "$(highest "$CURRENT" "$BASE")" != "$BASE" ]; then
            TAG="preview-v${BASE%.*}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $PREVIEW to dist-tag $TAG (preview is at ${CURRENT:-unset})"

      # Pack first and publish that exact tarball, so the bytes checked are the bytes published.
      - name: Pack
        id: pack
        run: |
          rm -f uipath-skills-library-*.tgz
          npm pack --pack-destination .
          TARBALL=$(ls uipath-skills-library-*.tgz)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          tar -tzf "$TARBALL" | sort

      # archived/ and templates/ must never reach an install path.
      - name: Check tarball contents
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          LIST=$(tar -tzf "$TARBALL")
          for required in package/.claude-plugin/plugin.json package/skills/; do
            echo "$LIST" | grep -q "^${required}" || { echo "::error::$required missing from $TARBALL"; exit 1; }
          done
          if echo "$LIST" | grep -E '^package/(archived|templates|scripts|\.github)/'; then
            echo "::error::$TARBALL ships files outside the install path"; exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      # Customers run published skills through DLP-style scanners that reject a whole
      # package on one card number, SSN, phone number, address or token. Scan the
      # exact bytes about to ship, with no baseline: every finding blocks.
      - name: Scan the tarball for customer-blocked content
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: python3 scripts/check-sensitive-content.py "$TARBALL"

      # No token and no setup-node registry-url: a token would make npm skip OIDC.
      # --provenance needs a public repo, id-token: write, and a matching repository.url.
      - name: Publish to npmjs (OIDC trusted publishing)
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          npm publish "./$TARBALL" \
            --registry https://registry.npmjs.org/ \
            --access public --provenance --tag "$DIST_TAG"
