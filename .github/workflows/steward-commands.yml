name: Steward commands

# /approve <sha> and /reject <reason>, typed by a steward as a comment on a pull request.
# issue_comment always runs the workflow and scripts from the default branch,
# never from the pull request, so a contributor cannot change what runs here.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: write

concurrency:
  group: steward-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    name: Run steward command
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENTER_ID: ${{ github.event.comment.user.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/steward-command.mjs
