name: Sprint Release Cut

# Biweekly release cut, in lockstep with UiPath/skills (see docs/release.md).
# Same cadence and anchor as that repo's sprint-release-cut.yml, 30 minutes
# after it, so the core line is cut first. `main` carries the line in
# development (M.N.0). On each release Sunday it:
#
#   1. checks that UiPath/skills is on the same line: its `main` is still at
#      M.N, or it has already cut release/vM.N. Otherwise it stops, so the two
#      libraries never ship different lines under one release
#   2. cuts release/v<M.N> from main at the version ALREADY in main (no bump)
#   3. dispatches publish.yml twice on the release branch and waits for both:
#      channel=dev (GitHub Packages) and channel=preview (npmjs). The bot's own
#      branch push cannot trigger publish.yml (GITHUB_TOKEN recursion guard),
#      so the dispatches are explicit. Stable (`latest`) is promoted MANUALLY
#   4. opens a PR bumping main to the NEXT line (M.(N+1).0), even if step 3
#      failed, with a warning in the body. The cut never pushes to main.

on:
  schedule:
    - cron: '30 6 * * 0' # Sunday 06:30 UTC, 30 min after the UiPath/skills cut
  workflow_dispatch:
    inputs:
      minor_override:
        description: 'Line to cut as MAJOR.MINOR (e.g. 1.208): skips the cadence gate and the lockstep check'
        required: false
        default: ''
      dry_run:
        description: 'Print the computed plan without pushing, publishing, or opening a PR'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run publish.yml` needs this; an explicit block sets every
  # unlisted scope to `none`, and the cut would publish nothing.
  actions: write

# Cron cannot express "every two Sundays": fire every Sunday, then gate on the
# 14-day cadence anchor. Must stay equal to UiPath/skills' anchor.
env:
  RELEASE_CADENCE_ANCHOR: "2026-06-14"
  CORE_REPO: UiPath/skills

# Serialize cuts so a scheduled run and a manual dispatch cannot race.
concurrency:
  group: release-line-updates
  cancel-in-progress: false

jobs:
  cut:
    # Forks have no business cutting UiPath release lines.
    if: github.repository == 'UiPath/skills-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - name: Cadence gate and resolve lines
        id: target
        env:
          MINOR_OVERRIDE: ${{ github.event.inputs.minor_override }}
        run: |
          set -euo pipefail
          CURRENT_LINE=$(jq -r '.version | split(".") | "\(.[0]).\(.[1])"' package.json)
          echo "current_line=$CURRENT_LINE" >> "$GITHUB_OUTPUT"

          if [ -n "$MINOR_OVERRIDE" ]; then
            # Bash =~ matches the whole string, unlike grep, which passes a
            # multi-line value whose first line matches. A newline here would
            # forge extra step outputs.
            if [[ ! "$MINOR_OVERRIDE" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::minor_override is not MAJOR.MINOR."
              exit 1
            fi
            CUT_LINE="$MINOR_OVERRIDE"
            echo "Manual override -> cut $CUT_LINE (cadence gate and lockstep check skipped)."
          else
            # A manual run without an override also honors the gate, so a stray
            # dispatch cannot cut off-cadence.
            anchor_epoch=$(date -u -d "$RELEASE_CADENCE_ANCHOR" +%s)
            today_epoch=$(date -u -d "$(date -u +%Y-%m-%d)" +%s)
            days_since=$(( (today_epoch - anchor_epoch) / 86400 ))
            if [ "$days_since" -lt 0 ] || [ $(( days_since % 14 )) -ne 0 ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              {
                echo "## Skipped: off-cadence Sunday"
                echo ""
                echo "Release Sundays are every 14 days from \`$RELEASE_CADENCE_ANCHOR\`; today is +$days_since days. Use \`minor_override\` to cut anyway."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Cut main's CURRENT line, no +1.
            CUT_LINE="$CURRENT_LINE"
          fi

          CUT_MAJOR=$(echo "$CUT_LINE" | cut -d. -f1)
          CUT_MINOR=$(echo "$CUT_LINE" | cut -d. -f2)
          echo "cut_line=$CUT_LINE" >> "$GITHUB_OUTPUT"
          echo "next_line=$CUT_MAJOR.$((CUT_MINOR + 1))" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # The core repo is public, so GITHUB_TOKEN can read it. Its line is in
      # step when its main is still on CUT_LINE (core not cut yet, or bump PR
      # not merged) or it already has release/v<CUT_LINE> (core cut first).
      - name: Lockstep check against UiPath/skills
        if: steps.target.outputs.proceed == 'true' && github.event.inputs.minor_override == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUT_LINE: ${{ steps.target.outputs.cut_line }}
        run: |
          set -euo pipefail
          CORE_LINE=$(gh api "repos/$CORE_REPO/contents/package.json?ref=main" --jq .content \
            | base64 -d | jq -r '.version | split(".") | "\(.[0]).\(.[1])"')
          if [ "$CORE_LINE" = "$CUT_LINE" ]; then
            echo "$CORE_REPO main is on $CORE_LINE: in step."
          elif gh api "repos/$CORE_REPO/branches/release/v$CUT_LINE" --silent 2>/dev/null; then
            echo "$CORE_REPO already cut release/v$CUT_LINE (its main is on $CORE_LINE): in step."
          else
            echo "::error::Out of step: this repo would cut $CUT_LINE, but $CORE_REPO main is on $CORE_LINE and has no release/v$CUT_LINE. Merge the pending version-bump PR, or dispatch with minor_override."
            exit 1
          fi

      - name: Dry run — print plan
        if: steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run == 'true'
        # Step outputs reach the shell through env, never through ${{ }} in the script.
        env:
          CURRENT_LINE: ${{ steps.target.outputs.current_line }}
          CUT_LINE: ${{ steps.target.outputs.cut_line }}
          NEXT_LINE: ${{ steps.target.outputs.next_line }}
        run: |
          {
            echo "## Dry run — planned sprint cut"
            echo ""
            echo "- current line (main): \`$CURRENT_LINE\`"
            echo "- cut line: \`$CUT_LINE\` — branch \`release/v$CUT_LINE\` @ \`$(git rev-parse --short HEAD)\` at version \`$CUT_LINE.0\`"
            echo "- would publish (and wait): dev to GitHub Packages, preview to npmjs — stable stays manual"
            echo "- would open a bump PR: \`main\` -> \`$NEXT_LINE.0\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cut release branch
        id: cutbranch
        if: steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          LINE: ${{ steps.target.outputs.cut_line }}
        run: |
          set -euo pipefail
          BRANCH="release/v$LINE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            # A prior run cut it: resume, as long as it carries this line.
            git fetch origin "$BRANCH"
            git checkout --detach FETCH_HEAD
            EXISTING_VERSION=$(node -p "require('./package.json').version")
            if [ "$EXISTING_VERSION" != "$LINE.0" ]; then
              echo "::error::$BRANCH already exists at version $EXISTING_VERSION (expected $LINE.0) — resolve manually."
              exit 1
            fi
            echo "$BRANCH already cut at $LINE.0 — resuming."
          else
            git checkout -b "$BRANCH"
            # Usually a no-op; an override targeting another line sets it here.
            npm version "$LINE.0" --no-git-tag-version --allow-same-version
            node scripts/sync-version.mjs
            # Stage exactly the files sync-version.mjs owns, read from the script,
            # so a manifest added later is never left out of the commit.
            MANIFESTS="$(node scripts/sync-version.mjs --list-paths)"
            if [ -z "$MANIFESTS" ]; then
              echo "::error::sync-version.mjs --list-paths returned nothing; refusing to commit a partial version bump."
              exit 1
            fi
            git add $MANIFESTS
            if git diff --cached --quiet; then
              echo "release branch matches main at $LINE.0 — no version commit needed."
            else
              git commit -m "Cut the $LINE release line"
            fi
            git push origin "HEAD:$BRANCH"
          fi
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish dev + preview from the release branch (wait for success)
        id: publish
        if: steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE: ${{ steps.target.outputs.cut_line }}
        run: |
          set -euo pipefail
          BRANCH="release/v$LINE"
          # `gh workflow run` does not return the run id: record the newest
          # dispatch run for the branch, dispatch, poll for a newer one, then
          # watch it (non-zero exit when the run fails).
          RESULT_RUN_ID=""
          dispatch_and_wait() {
            channel="$1"
            before=$(gh run list --workflow publish.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            echo "Dispatching publish.yml channel=$channel on $BRANCH..."
            gh workflow run publish.yml --ref "$BRANCH" -f channel="$channel"
            run_id=""
            for _ in $(seq 1 40); do
              sleep 6
              latest=$(gh run list --workflow publish.yml --branch "$BRANCH" \
                --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
              if [ "$latest" != "$before" ] && [ "$latest" != "0" ]; then
                run_id="$latest"; break
              fi
            done
            if [ -z "$run_id" ]; then
              echo "::error::Timed out finding the dispatched publish.yml run for channel=$channel."
              return 1
            fi
            RESULT_RUN_ID="$run_id"
            echo "Watching publish.yml run $run_id (channel=$channel)..."
            gh run watch "$run_id" --exit-status --interval 15
          }

          dispatch_and_wait dev
          dispatch_and_wait preview
          PREVIEW_RUN_NUMBER=$(gh run view "$RESULT_RUN_ID" --json number --jq '.number')
          echo "preview_version=$LINE.0-preview.$PREVIEW_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Open version-bump PR against main
        id: mainbump
        # Gated on the branch cut, not the publish: advancing main is independent
        # of the publish, and a failed publish is carried as a warning.
        if: always() && steps.cutbranch.outcome == 'success' && steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          CUT_LINE: ${{ steps.target.outputs.cut_line }}
          NEXT_LINE: ${{ steps.target.outputs.next_line }}
        run: |
          set -euo pipefail
          PR_BRANCH="auto/sprint-bump-$NEXT_LINE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          EXISTING=$(gh pr list --state open --head "$PR_BRANCH" --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            echo "url=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Bump PR already open: $EXISTING"
            exit 0
          fi

          git fetch origin main
          git checkout -B "$PR_BRANCH" origin/main
          npm version "$NEXT_LINE.0" --no-git-tag-version --allow-same-version
          node scripts/sync-version.mjs
          MANIFESTS="$(node scripts/sync-version.mjs --list-paths)"
          if [ -z "$MANIFESTS" ]; then
            echo "::error::sync-version.mjs --list-paths returned nothing; refusing to commit a partial version bump."
            exit 1
          fi
          git add $MANIFESTS
          if git diff --cached --quiet; then
            echo "main already at $NEXT_LINE.0 — no bump PR needed."
            exit 0
          fi
          BODY="Automated sprint cut: \`release/v$CUT_LINE\` was cut. Merge to advance \`main\` to \`$NEXT_LINE.0\`, in step with $CORE_REPO. Merge it before the next cut, or that cut stops at the lockstep check. Stable \`$CUT_LINE.0\` is promoted manually — see docs/release.md."
          if [ "${PUBLISH_OUTCOME:-}" = "success" ]; then
            BODY="$BODY"$'\n\n'":white_check_mark: dev + preview builds published from \`release/v$CUT_LINE\`."
          else
            BODY="$BODY"$'\n\n'":warning: The dev/preview publish did **not** succeed (outcome: \`${PUBLISH_OUTCOME:-unknown}\`). Check the run logs before merging."
          fi
          # A PR opened with GITHUB_TOKEN does not trigger the required checks:
          # close and reopen it to run them.
          BODY="$BODY"$'\n\n'"> Opened by \`GITHUB_TOKEN\`, so required checks do not start on their own: close and reopen this PR to run them."

          git commit -m "Bump main to $NEXT_LINE.0 after cutting $CUT_LINE"
          git push origin "HEAD:$PR_BRANCH"
          URL=$(gh pr create --head "$PR_BRANCH" --base main \
            --title "Bump main to $NEXT_LINE.0 (sprint cut)" \
            --body "$BODY")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always() && steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          CUT_LINE: ${{ steps.target.outputs.cut_line }}
          NEXT_LINE: ${{ steps.target.outputs.next_line }}
          SHORT_SHA: ${{ steps.cutbranch.outputs.short_sha }}
          CUT_OUTCOME: ${{ steps.cutbranch.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PREVIEW_VERSION: ${{ steps.publish.outputs.preview_version }}
          BUMP_URL: ${{ steps.mainbump.outputs.url }}
        run: |
          {
            echo "## Sprint cut"
            echo ""
            echo "- cut line: \`$CUT_LINE\` — \`release/v$CUT_LINE\` @ \`$SHORT_SHA\` ($CUT_OUTCOME)"
            echo "- dev + preview publish: $PUBLISH_OUTCOME $PREVIEW_VERSION"
            echo "- bump PR (-> \`$NEXT_LINE.0\`): $BUMP_URL"
          } >> "$GITHUB_STEP_SUMMARY"
