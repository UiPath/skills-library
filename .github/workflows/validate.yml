name: Validate skills

# No `paths:` filter on purpose: this is a required check, and a required check
# that never reports blocks the merge forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validator tests
        run: npm test
      # Same command as the guard in publish.yml, so drift fails here, before merge,
      # instead of silently blocking every publish after it.
      - name: Plugin manifests match package.json
        run: npm run version:check
      - name: Validate every skill folder
        run: npm run validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Content scanner tests
        run: |
          pip install pytest==8.3.5
          pytest -q scripts/test_check_sensitive_content.py
      # The publish job runs the same scan on the packed tarball and blocks on any
      # finding, so catch it here, on the pull request that adds it.
      - name: Scan shipped content for customer-blocked data
        run: npm run content:check
